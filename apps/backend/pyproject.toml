[project]
name = "nomi-backend"
version = "0.1.0"
description = "Backend API and behavioural baseline services for Nomi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
